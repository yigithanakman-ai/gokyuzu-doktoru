name: Android APK ve Play Store AAB Derle ve Yayınla

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Android APK ve AAB Build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Kodları Çek (Checkout)
        uses: actions/checkout@v4

      - name: Java 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Flutter Kurulumu
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Paketleri İndir (pub get)
        run: |
          cd gokyuzu_app
          flutter pub get

      - name: Resmi Dijital İmza (Upload Keystore) Otomatik Kurulumu
        run: |
          mkdir -p gokyuzu_app/android/app
          cat << 'EOF' | base64 -d > gokyuzu_app/android/app/upload-keystore.jks
          
          EOF
          cat << 'EOF' > gokyuzu_app/android/key.properties
          storePassword=GokyuzuDoktoru2026!UploadKey
          keyPassword=GokyuzuDoktoru2026!UploadKey
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOF
          echo "Resmi imza dosyaları GitHub sunucusuna başarıyla yüklendi ve bağlandı."

      - name: Release APK ve Play Store App Bundle (AAB) Derle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd gokyuzu_app
          mkdir -p build/debug-symbols
          flutter build apk --release --obfuscate --split-debug-info=build/debug-symbols --no-tree-shake-icons --android-skip-build-dependency-validation
          flutter build appbundle --release --obfuscate --split-debug-info=build/debug-symbols --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Dağıtım Dosyalarını Kopyala
        run: |
          cp gokyuzu_app/build/app/outputs/flutter-apk/app-release.apk ./gokyuzu-doktoru.apk
          cp gokyuzu_app/build/app/outputs/bundle/release/app-release.aab ./gokyuzu-doktoru.aab

      - name: Artifact Olarak Yükle (GitHub Actions İndirme)
        uses: actions/upload-artifact@v4
        with:
          name: gokyuzu-doktoru-builds
          path: |
            gokyuzu-doktoru.apk
            gokyuzu-doktoru.aab
          retention-days: 30

      - name: GitHub Release Olarak Yayınla (Doğrudan İndirme ve Play Store)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.14-build19
          name: "📱 Gökyüzü Doktoru - v1.0.14 (Sürüm Kodu 19 & Ay Burç, 28 Ay Menzili ve Gezegen Burç Geçiş Bildirimleri)"
          body: |
            ### 🪐 Gökyüzü Doktoru Android Sürümleri (v1.0.14 / Sürüm Kodu 19)

            - **`gokyuzu-doktoru.apk`**: Kendi Android telefonunuzda doğrudan test edip kullanmak için yükleme dosyası (İmzalı, Obfuscated).
            - **`gokyuzu-doktoru.aab`**: Google Play Console'a yükleyeceğiniz resmi Android App Bundle paketi (Resmi Upload İmzalı, Sürüm Kodu 19, ProGuard & R8 Korumalı).

            #### 🌟 Bu Sürümdeki Yenilikler (Build 19):
            1. **🌙 Anlık Ay Burç Değişim Bildirimleri (Moon Sign Ingress)**:
               - Transit Ay her yeni burca geçtiğinde (ortalama ~2.5 günde bir) dakika dakikasına hassas ikili arama algoritmasıyla tespit edilip anlık bildirim fırlatılır.
               - Yeni burcun element, tema ve psikolojik etkilerine özel rehberlik sunulur.
            2. **🔮 28 Kadim Ay Menzili Geçiş Bildirimleri (Lunar Mansion Transitions)**:
               - Transit Ay 28 kadim duraktan (El-Şaratan, Butayn, Sa'd el-Ahbiye vb.) bir diğerine geçtiğinde anlık bildirim üretilir.
               - Menzilin doğası (Uğurlu/Nahs), kadim Hermetik rezonansı ve sakınılması gereken durumlar telefon ekranına kilitli olsa dahi iletilir.
            3. **🪐 Gezegenlerin Yeni Bir Burca Geçiş Bildirimleri (Planetary Ingress)**:
               - Güneş, Merkür, Venüs, Mars, Jüpiter ve Satürn yeni bir burca 00° 00' ile adım attığında anlık ingress bildirimi kurulur.
               - Gelecek 21 günlük gökyüzü rotası taranarak kullanıcıya burç geçiş anı ulaştırılır.
            4. **📋 Ayarlar & Açılış İzin Ekranında Tam Bildirim Listesi**:
               - Ayarlar / Profil ekranı ve Bildirim İzni penceresine bu 3 yeni astronomik bildirim akışı (Ay Burç, Ay Menzil, Gezegen Girişleri) renkli ve detaylı maddeler olarak eklendi.
            5. **Haritayı 2 Parmakla Büyütme (Pinch-to-Zoom / `ChartZoomScreen`)**:
               - Çark döndürme kaldırıldı; harita evrensel oryantasyonda sabitlendi.
               - 2 parmakla 0.6x - 6.0x serbest yakınlaştırma ve çift dokunuşla sıfırlama.
            6. **Kilitli / Uykuda / Şarjda / Pilde Kesintisiz Tam Zamanlı Bildirim Garantisi**:
               - `NotificationVisibility.public`, `SCHEDULE_EXACT_ALARM`, `WAKE_LOCK` ve `exactAllowWhileIdle` ile 7/24 tam zamanlı alarm koruması.
            7. **Siber Güvenlik, R8/ProGuard Karartma & DST / Solar Fire Kalibrasyonu Korundu**.
          files: |
            gokyuzu-doktoru.apk
            gokyuzu-doktoru.aab
