name: Android APK ve Play Store AAB Derle ve Yayınla

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Android APK ve AAB Build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Kodları Çek (Checkout)
        uses: actions/checkout@v4

      - name: Java 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Flutter Kurulumu
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Paketleri İndir (pub get)
        run: |
          cd gokyuzu_app
          flutter pub get

      - name: Resmi Dijital İmza (Upload Keystore) Otomatik Kurulumu
        run: |
          mkdir -p gokyuzu_app/android/app
          cat << 'EOF' | base64 -d > gokyuzu_app/android/app/upload-keystore.jks
          
          EOF
          cat << 'EOF' > gokyuzu_app/android/key.properties
          storePassword=GokyuzuDoktoru2026!UploadKey
          keyPassword=GokyuzuDoktoru2026!UploadKey
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOF
          echo "Resmi imza dosyaları GitHub sunucusuna başarıyla yüklendi ve bağlandı."

      - name: Release APK ve Play Store App Bundle (AAB) Derle
        run: |
          cd gokyuzu_app
          flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation > /tmp/build_apk.log 2>&1 || true
          flutter build appbundle --release --no-tree-shake-icons --android-skip-build-dependency-validation > /tmp/build_aab.log 2>&1 || true

      - name: Debug Loglarini Push Et
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B debug-build-log
          cp /tmp/build_*.log ./ 2>/dev/null || true
          git add build_*.log 2>/dev/null || true
          git commit -m "chore: debug build logs" || true
          git push -f origin debug-build-log || true

      - name: Build Kontrol
        run: |
          if [ ! -f "gokyuzu_app/build/app/outputs/flutter-apk/app-release.apk" ]; then
            echo "APK build failed!"
            cat /tmp/build_apk.log | tail -n 60
            exit 1
          fi

      - name: Dağıtım Dosyalarını Kopyala
        run: |
          cp gokyuzu_app/build/app/outputs/flutter-apk/app-release.apk ./gokyuzu-doktoru.apk
          cp gokyuzu_app/build/app/outputs/bundle/release/app-release.aab ./gokyuzu-doktoru.aab

      - name: Artifact Olarak Yükle (GitHub Actions İndirme)
        uses: actions/upload-artifact@v4
        with:
          name: gokyuzu-doktoru-builds
          path: |
            gokyuzu-doktoru.apk
            gokyuzu-doktoru.aab
          retention-days: 30

      - name: GitHub Release Olarak Yayınla (Doğrudan İndirme ve Play Store)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-apk
          name: "📱 Gökyüzü Doktoru - Test APK ve Play Store AAB (v1.0.0)"
          body: |
            ### 🪐 Gökyüzü Doktoru Android Sürümleri

            - **`gokyuzu-doktoru.apk`**: Kendi Android telefonunuzda doğrudan test edip kullanmak için yükleme dosyası (İmzalı).
            - **`gokyuzu-doktoru.aab`**: Google Play Console'a yükleyeceğiniz resmi Android App Bundle paketi (Resmi Upload İmzalı).

            #### 📲 Telefona Nasıl Yüklenir (APK)?
            1. Aşağıdaki **Assets** bölümünden **`gokyuzu-doktoru.apk`** dosyasına dokunun ve telefonunuza indirin.
            2. Telefonunuzun bildirim panelinden veya Dosya Yöneticisi'nden indirilen dosyaya dokunun.
            3. "Bilinmeyen kaynaklardan yüklemeye izin verilsin mi?" uyarısı çıkarsa **İzin Ver / Aç** seçeneğini seçin.
            4. **Yükle** butonuna basın ve uygulamayı açın!
          files: |
            gokyuzu-doktoru.apk
            gokyuzu-doktoru.aab
