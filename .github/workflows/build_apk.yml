name: Android APK ve Play Store AAB Derle ve Yayınla

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Android APK ve AAB Build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Kodları Çek (Checkout)
        uses: actions/checkout@v4

      - name: Java 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Flutter Kurulumu
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Paketleri İndir (pub get)
        run: |
          cd gokyuzu_app
          flutter pub get

      - name: Resmi Dijital İmza (Upload Keystore) Otomatik Kurulumu
        run: |
          mkdir -p gokyuzu_app/android/app
          cat << 'EOF' | base64 -d > gokyuzu_app/android/app/upload-keystore.jks
          
          EOF
          cat << 'EOF' > gokyuzu_app/android/key.properties
          storePassword=GokyuzuDoktoru2026!UploadKey
          keyPassword=GokyuzuDoktoru2026!UploadKey
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOF
          echo "Resmi imza dosyaları GitHub sunucusuna başarıyla yüklendi ve bağlandı."

      - name: Release APK ve Play Store App Bundle (AAB) Derle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd gokyuzu_app
          mkdir -p build/debug-symbols
          flutter build apk --release --obfuscate --split-debug-info=build/debug-symbols --no-tree-shake-icons --android-skip-build-dependency-validation
          flutter build appbundle --release --obfuscate --split-debug-info=build/debug-symbols --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Dağıtım Dosyalarını Kopyala
        run: |
          cp gokyuzu_app/build/app/outputs/flutter-apk/app-release.apk ./gokyuzu-doktoru.apk
          cp gokyuzu_app/build/app/outputs/bundle/release/app-release.aab ./gokyuzu-doktoru.aab

      - name: Artifact Olarak Yükle (GitHub Actions İndirme)
        uses: actions/upload-artifact@v4
        with:
          name: gokyuzu-doktoru-builds
          path: |
            gokyuzu-doktoru.apk
            gokyuzu-doktoru.aab
          retention-days: 30

      - name: GitHub Release Olarak Yayınla (Doğrudan İndirme ve Play Store)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.14-build24
          name: "📱 Gökyüzü Doktoru - v1.0.14 (Sürüm Kodu 24 & Doğrudan Google Play Ödeme Alt Penceresi, Temiz Metin ve Gizli Tema)"
          body: |
            ### 🪐 Gökyüzü Doktoru Android Sürümleri (v1.0.14 / Sürüm Kodu 24)

            - **`gokyuzu-doktoru.apk`**: Kendi Android telefonunuzda doğrudan test edip kullanmak için yükleme dosyası (İmzalı, Obfuscated).
            - **`gokyuzu-doktoru.aab`**: Google Play Console'a yükleyeceğiniz resmi Android App Bundle paketi (Resmi Upload İmzalı, Sürüm Kodu 24, In-App Billing İzinli, ProGuard & R8 Korumalı).

            #### 🌟 Bu Sürümdeki Büyük Düzeltmeler (Build 24):
            1. **💳 Doğrudan Yerel Google Play Ödeme Alt Penceresi (Native In-App Billing)**:
               - VIP üyelik ve paket seçimi butonlarındaki tüm yapay geliştirici uyarı pencereleri tamamen kaldırıldı.
               - Kullanıcı paket seçtiğinde doğrudan Google Play'in resmi test/ödeme alt penceresi (BillingClient) tetiklenir veya Google Play mağaza sayfasına yönlendirilir.
            2. **✨ Temiz Astro Bülten Günlük Yorum Metni**:
               - Günlük burç ve bülten yorumlarında ekranda ham olarak gözüken tüm `**` yıldız işaretleri temizlendi; profesyonel, okunaklı ve saf metin formatına geçirildi.
            3. **🎃 Balkabağı Tema Butonu Gizlendi**:
               - Ana ekran üst gezinme çubuğundaki balkabağı butonu tamamen gizlendi. Kozmik temaların nereden ve nasıl değiştirildiği kullanıcılardan saklanarak tamamen gizli ve otomatik hale getirildi.
               - Reklam bekleme sürelerinde 2.5 saniyelik güvenlik zaman aşımı eklenerek kullanıcı deneyimi akıcı hale getirildi.
          files: |
            gokyuzu-doktoru.apk
            gokyuzu-doktoru.aab
