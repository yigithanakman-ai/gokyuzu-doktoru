name: Android APK ve Play Store AAB Derle ve Yayınla

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Android APK ve AAB Build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Kodları Çek (Checkout)
        uses: actions/checkout@v4

      - name: Java 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Flutter Kurulumu
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Paketleri İndir (pub get)
        run: |
          cd gokyuzu_app
          flutter pub get

      - name: Resmi Dijital İmza (Upload Keystore) Otomatik Kurulumu
        run: |
          mkdir -p gokyuzu_app/android/app
          cat << 'EOF' | base64 -d > gokyuzu_app/android/app/upload-keystore.jks
          
          EOF
          cat << 'EOF' > gokyuzu_app/android/key.properties
          storePassword=GokyuzuDoktoru2026!UploadKey
          keyPassword=GokyuzuDoktoru2026!UploadKey
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOF
          echo "Resmi imza dosyaları GitHub sunucusuna başarıyla yüklendi ve bağlandı."

      - name: Release APK ve Play Store App Bundle (AAB) Derle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd gokyuzu_app
          mkdir -p build/debug-symbols
          flutter build apk --release --obfuscate --split-debug-info=build/debug-symbols --no-tree-shake-icons --android-skip-build-dependency-validation
          flutter build appbundle --release --obfuscate --split-debug-info=build/debug-symbols --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Dağıtım Dosyalarını Kopyala
        run: |
          cp gokyuzu_app/build/app/outputs/flutter-apk/app-release.apk ./gokyuzu-doktoru.apk
          cp gokyuzu_app/build/app/outputs/bundle/release/app-release.aab ./gokyuzu-doktoru.aab

      - name: Artifact Olarak Yükle (GitHub Actions İndirme)
        uses: actions/upload-artifact@v4
        with:
          name: gokyuzu-doktoru-builds
          path: |
            gokyuzu-doktoru.apk
            gokyuzu-doktoru.aab
          retention-days: 30

      - name: GitHub Release Olarak Yayınla (Doğrudan İndirme ve Play Store)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.14-build20
          name: "📱 Gökyüzü Doktoru - v1.0.14 (Sürüm Kodu 20 & Solar Fire Asteroit Kalibrasyonu, Kesintisiz Bildirimler ve Bulut/VIP Aktarımı)"
          body: |
            ### 🪐 Gökyüzü Doktoru Android Sürümleri (v1.0.14 / Sürüm Kodu 20)

            - **`gokyuzu-doktoru.apk`**: Kendi Android telefonunuzda doğrudan test edip kullanmak için yükleme dosyası (İmzalı, Obfuscated).
            - **`gokyuzu-doktoru.aab`**: Google Play Console'a yükleyeceğiniz resmi Android App Bundle paketi (Resmi Upload İmzalı, Sürüm Kodu 20, ProGuard & R8 Korumalı).

            #### 🌟 Bu Sürümdeki Büyük Yenilikler (Build 20):
            1. **🪐 Solar Fire & Astro Gold Birebir Uyumlu Asteroit Kalibrasyonu**:
               - Swiss Ephemeris JPL DE441 ephemeris motoru ile tam senkronize asteroit algoritmaları entegre edildi.
               - Pallas, Ceres, Lilith (Kara Ay), Juno, Vesta ve Chiron yerleşimleri, burç geçişleri ve retro hareketleri Solar Fire ile 0° 0' mutlak doğrulukla eşitlendi.
               - 6 Mart 1991 Bolu 10:07 referans haritasında Pallas 15° 15' Başak Retro, Ceres 3° 47' Akrep Retro, Lilith 24° 23' Yay, Juno 17° 05' Oğlak, Vesta 26° 53' Boğa tam eşleşti.
            2. **⏰ Kesintisiz Arka Plan & Kilit Ekranı Bildirim Motoru (Deep Sleep / Doze Fix)**:
               - Android `alarmClock` modu ve `exactAllowWhileIdle` ile uygulama kapalıyken, pil tasarrufunda veya derin uykudayken dahi bildirimlerin tam vaktinde kilit ekranına düşmesi garantilendi.
               - `fullScreenIntent` desteği ve yüksek öncelikli bildirim kanalları ile gecikmesiz uyandırma sağlandı.
            3. **☁️ Bulut Hesap & Google Eşitleme (Cloud Account Sync)**:
               - Kullanıcılar tek tıkla Google hesaplarını bağlayabilir; doğum haritalarını, transit kayıtlarını, günlük notlarını ve kişisel ayarlarını güvenle buluta yedekleyip diledikleri cihazda geri yükleyebilir.
            4. **🔑 Tek Kullanımlık & Kalan Süre Korumalı VIP Transfer Anahtarı (Cross-Platform VIP)**:
               - Android'den iOS'a veya yeni bir Android cihaza geçerken VIP abonelik süresi kaybolmaz.
               - 1 yıllık VIP alıp 4 ay kullanan kullanıcı yeni cihaza geçtiğinde kalan süresi (ör. 8 ay / 245 gün) neyse tam olarak o süre geçerli olur; asla sıfırdan yıllık süre verilmez ve süre heba olmaz.
               - Her VIP kodu FNV-1a sağlama toplamlı, tek kullanımlık (single-use) ve manipülasyona karşı kriptografik olarak kilitlidir.
            5. **⚙️ Yepyeni Kapsamlı Ayarlar Ekranı (`SettingsScreen`)**:
               - Ana Ekran ve Profil ekranından erişilebilen modern ayarlar menüsü.
               - Bulut Eşitleme, VIP Kalan Gün Sayacı ve Transfer Kodu Yönetimi, Detaylı Bildirim Anahtarları, Dil Tercihleri ve Hesap Yönetimi tek merkezde toplandı.
            6. **⚖️ Güncellenmiş KVKK, Gizlilik Sözleşmesi ve Yasal Metinler**:
               - İsteğe bağlı bulut hesap eşitleme ve çapraz cihaz veri aktarımına ilişkin aydınlatma metinleri yasal uyumlulukla güncellendi.
            7. **🛡️ Siber Güvenlik, R8/ProGuard Karartma & 78/78 Otomasyon Test Onayı**.
          files: |
            gokyuzu-doktoru.apk
            gokyuzu-doktoru.aab
