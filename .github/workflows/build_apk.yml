name: Android APK ve Play Store AAB Derle ve Yayınla

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Android APK ve AAB Build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Kodları Çek (Checkout)
        uses: actions/checkout@v4

      - name: Java 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Flutter Kurulumu
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Paketleri İndir (pub get)
        run: |
          cd gokyuzu_app
          flutter pub get

      - name: Dijital İmza (Keystore) Kurulumu
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "GitHub Secret bulundu, resmi imza dosyası yükleniyor..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > gokyuzu_app/android/app/upload-keystore.jks
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > gokyuzu_app/android/key.properties
            echo "keyPassword=${{ secrets.KEYSTORE_PASSWORD }}" >> gokyuzu_app/android/key.properties
            echo "keyAlias=upload" >> gokyuzu_app/android/key.properties
            echo "storeFile=upload-keystore.jks" >> gokyuzu_app/android/key.properties
          else
            echo "GitHub Secret henüz tanımlanmamış, derleme hazır yapılandırma ile devam ediyor."
          fi

      - name: Release APK ve Play Store App Bundle (AAB) Derle
        run: |
          cd gokyuzu_app
          flutter build apk --release --no-tree-shake-icons
          flutter build appbundle --release --no-tree-shake-icons

      - name: Dağıtım Dosyalarını Kopyala
        run: |
          cp gokyuzu_app/build/app/outputs/flutter-apk/app-release.apk ./gokyuzu-doktoru.apk
          cp gokyuzu_app/build/app/outputs/bundle/release/app-release.aab ./gokyuzu-doktoru.aab

      - name: Artifact Olarak Yükle (GitHub Actions İndirme)
        uses: actions/upload-artifact@v4
        with:
          name: gokyuzu-doktoru-builds
          path: |
            gokyuzu-doktoru.apk
            gokyuzu-doktoru.aab
          retention-days: 30

      - name: GitHub Release Olarak Yayınla (Doğrudan İndirme ve Play Store)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-apk
          name: "📱 Gökyüzü Doktoru - Test APK ve Play Store AAB (v1.0.0)"
          body: |
            ### 🪐 Gökyüzü Doktoru Android Sürümleri

            - **`gokyuzu-doktoru.apk`**: Kendi Android telefonunuzda doğrudan test edip kullanmak için yükleme dosyası.
            - **`gokyuzu-doktoru.aab`**: Google Play Console'a yükleyeceğiniz resmi Android App Bundle paketi.

            #### 📲 Telefona Nasıl Yüklenir (APK)?
            1. Aşağıdaki **Assets** bölümünden **`gokyuzu-doktoru.apk`** dosyasına dokunun ve telefonunuza indirin.
            2. Telefonunuzun bildirim panelinden veya Dosya Yöneticisi'nden indirilen dosyaya dokunun.
            3. "Bilinmeyen kaynaklardan yüklemeye izin verilsin mi?" uyarısı çıkarsa **İzin Ver / Aç** seçeneğini seçin.
            4. **Yükle** butonuna basın ve uygulamayı açın!
          files: |
            gokyuzu-doktoru.apk
            gokyuzu-doktoru.aab
